{% extends 'base.html' %}{% import '_b.html' as b with context %}
{% block title %}로그인 · SOBORU Business{% endblock %}
{% block bar %}{{ b.bar('') }}{% endblock %}
{% block body %}
<div class="auth"><h1 class="h1">SOBORU Business<br>로그인</h1><p class="sub">CS 운영, 한큐에</p>
<form method="post" class="stack" style="margin-top:32px"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<input class="inp" name="login_id" type="email" placeholder="이메일" required autocomplete="username">
<input class="inp" name="password" type="password" placeholder="비밀번호" required autocomplete="current-password">
<button class="btn full" style="margin-top:8px">로그인</button></form>
<p class="cap" style="text-align:center;margin-top:24px">처음이신가요? <a class="link" href="{{ url_for('signup') }}">무료로 시작하기</a></p></div>
{% endblock %}
