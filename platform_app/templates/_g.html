{# 파트너 화면 위쪽 #}
{% import '_b.html' as bb %}
{% macro pbar(u=None) -%}
<header class="gnb"><div class="wrap"><a class="logo biz" href="{{ url_for('gr.dashboard') if u else url_for('decide') }}">{{ bb.soboru_logo() }}<small class="w">파트너</small></a>
<div class="right">{% if u %}<span class="tbtn hide-m">{{ u.pname }} · {{ u.name }}</span><form method="post" action="{{ url_for('gr.plogout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="tbtn">로그아웃</button></form>{% else %}<a class="tbtn" href="{{ url_for('gr.apply') }}">파트너 신청</a>{% endif %}</div></div></header>
{%- endmacro %}
