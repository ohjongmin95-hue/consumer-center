# 민주의 카드뉴스 제작 프로그램(cardnews/)을 윈도우 실행 파일 하나로 만들어 Releases의 'cardnews-latest'에 올립니다.
# 받는 곳: 저장소 > Releases > 민주의 카드뉴스 제작 프로그램 (최신) > MinjuCardNews.exe
name: 민주의 카드뉴스 제작 프로그램 만들기
on:
  push:
    paths: ['cardnews/**', '.github/workflows/cardnews-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cardnews-build
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cardnews
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 준비
        run: python -m pip install -r requirements.txt pyinstaller
      - name: 시험
        run: python -m unittest discover -s tests
      - name: 실행 파일 만들기
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MinjuCardNews-windows
          path: cardnews/dist/MinjuCardNews.exe
      - name: Releases에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cardnews-latest --yes --cleanup-tag || true
          gh release create cardnews-latest dist/MinjuCardNews.exe --prerelease --target "$GITHUB_SHA" \
            --title "민주의 카드뉴스 제작 프로그램 (최신)" \
            --notes "MinjuCardNews.exe 를 내려받아 더블클릭하세요. 키 없이도 쓸 수 있고, 자동으로 만들려면 설정에서 키를 넣어요. 브랜치 ${GITHUB_REF_NAME} · $(date -u +%Y-%m-%d)"
