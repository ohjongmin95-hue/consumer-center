<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}소보루 기자실{% endblock %}</title>
  <link rel="icon" href="{{ url_for('favicon_ico') }}" sizes="48x48">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg', v=css_v) }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png', v=css_v) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=css_v) }}">
</head>
<body class="console newsroom">
{# 소보루 기자 전용 화면 틀. 관리자 화면(console.html)과 완전히 따로 씀. #}
{% if g.get('staff') %}
<header class="nr-bar">
  <div class="nr-bar-inner">
    <a class="nr-brand" href="{{ url_for('reporter_home') }}"><b>SOBORU</b><span>기자실</span></a>
    <nav class="nr-nav" aria-label="기자실 메뉴"><a href="{{ url_for('reporter_home') }}"{% if request.endpoint != 'reporter_password' %} class="on" aria-current="page"{% endif %}>제보 처리</a></nav>
    <div class="nr-user">
      <span class="nr-name">{{ g.staff['name'] }} 기자</span>
      <a href="{{ url_for('reporter_password') }}">비밀번호 변경</a>
      <form method="post" action="{{ url_for('reporter_logout') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button type="submit">로그아웃</button></form>
    </div>
  </div>
</header>
{% endif %}
{% with msgs = get_flashed_messages() %}
{% if msgs %}<div class="cs-flash" role="status">{% for msg in msgs %}<div class="alert">{{ msg }}</div>{% endfor %}</div>{% endif %}
{% endwith %}
<div class="cs-main">{% block content %}{% endblock %}</div>
<script>
  // 목록의 줄 아무 곳이나 눌러도 그 제보가 열림 (글자를 드래그해 고를 때·새 탭 클릭은 그대로)
  document.addEventListener('click', function (e) {
    var row = e.target.closest('tr[data-href]');
    if (!row || e.target.closest('a, button, input, select, textarea, label') || String(window.getSelection())) return;
    if (e.ctrlKey || e.metaKey) window.open(row.dataset.href, '_blank'); else location.href = row.dataset.href;
  });
</script>
</body>
</html>
