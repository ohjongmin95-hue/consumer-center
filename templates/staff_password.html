{% extends 'console.html' %}
{% block title %}비밀번호 변경 | {{ txt('site.name') }}{% endblock %}
{% block content %}
<main class="cs-page cs-narrow">
  <h1 class="cs-title">비밀번호 변경</h1>
  <form class="cs-panel" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="p-cur">지금 비밀번호</label><input id="p-cur" type="password" name="current" required autocomplete="current-password"></div>
    <div class="field"><label for="p-new">새 비밀번호</label><input id="p-new" type="password" name="password" minlength="8" maxlength="64" required autocomplete="new-password" placeholder="영문+숫자 8자 이상"></div>
    <div class="field"><label for="p-new2">새 비밀번호 확인</label><input id="p-new2" type="password" name="password2" minlength="8" maxlength="64" required autocomplete="new-password"></div>
    <button class="cs-btn cs-btn-main" type="submit">바꾸기</button>
  </form>
</main>
{% endblock %}
