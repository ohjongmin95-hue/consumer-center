<!doctype html>
{# 인터넷이 끊겼을 때 서비스 워커(static/sw.js)가 보여 주는 단독 화면. 회원 정보·외부 글꼴 없이 이 파일만으로 보이게 #}
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>연결이 끊겼어요 | 소보루</title>
  <style>
    :root{--ink:#1d1d1f;--sub:#6b6f76;--orange:#ef7300;--soft:#fff1e3;--brown:#652D1C}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:#fff;color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
    main{width:100%;max-width:400px;text-align:center}
    .pic{width:min(240px,64vw);height:auto;display:block;margin:0 auto 8px}
    h1{font-size:24px;line-height:1.35;letter-spacing:-.02em;margin:8px 0 10px;color:var(--brown)}
    p{font-size:16px;line-height:1.65;color:var(--sub);margin:0 0 28px}
    button{appearance:none;border:0;width:100%;height:56px;border-radius:16px;background:var(--orange);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s cubic-bezier(.2,.8,.2,1)}
    button:active{transform:scale(.97)}
    button:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
    .tip{margin:16px 0 0;font-size:14px;color:#9a9ea5}
  </style>
</head>
<body>
  <main>
    <img class="pic" src="{{ url_for('static', filename='img/soboru-character-hero.png', v=css_v) }}" alt="" width="579" height="479">
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>와이파이나 모바일 데이터를 확인한 뒤<br>다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도하기</button>
    <p class="tip">연결되면 보던 화면으로 바로 돌아가요.</p>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
