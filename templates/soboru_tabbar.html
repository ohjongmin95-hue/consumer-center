{# 휴대폰 아래 탭바 (앱처럼). 소보루 브랜드일 때만 #}
{% set p = request.path %}
<nav class="sb-tabbar" aria-label="바로가기">
  <a href="{{ url_for('home') }}"{% if p == '/' %} class="on" aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>홈</a>
  <a href="{{ url_for('life') }}"{% if p.startswith('/life') %} class="on" aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>생활정보</a>
  <a class="sb-tab-plus" href="{{ url_for('report') }}"{% if p.startswith('/report') and not p.startswith('/reports') %} aria-current="page"{% endif %}><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>제보</a>
  <a href="{{ url_for('board') }}"{% if p.startswith('/board') %} class="on" aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>{{ ui('sb.nav_board', '소보루 픽') }}</a>
  <a href="{{ url_for('mypage') if g.user else url_for('lookup') }}"{% if p.startswith(('/me', '/lookup')) %} class="on" aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4 21c.9-4 4-6 8-6s7.1 2 8 6"/></svg>{{ 'MY' if g.user else '내 제보' }}</a>
</nav>
