{% macro heart(filled=False) %}<svg class="ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.8 1.3-1.7 2.9-2.8 4.9-2.8 3.5 0 5.7 3.4 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="{{ 'currentColor' if filled else 'none' }}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>{% endmacro %}
{% macro bubble() %}<svg class="ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5.5h16v10.5H9.5L5 19.5V16H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>{% endmacro %}
{% macro chip(category, categories) %}<span class="cat-chip cat-{{ categories.index(category) if category in categories else 0 }}">{{ category }}</span>{% endmacro %}
