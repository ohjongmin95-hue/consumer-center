{% extends 'console.html' %}
{% block title %}관리자 로그인 | {{ txt('site.name') }}{% endblock %}
{% block content %}
{# 토스식 로그인: 기자 로그인(reporter_login.html)과 같은 모양 #}
<main class="sl-page">
  <aside class="sl-hero" aria-hidden="true">
    <p class="sl-hero-kicker">SOBORU 관리자</p>
    <p class="sl-hero-title">소보루와 제보센터를<br><em>한곳에서</em> 관리해요</p>
  </aside>
  <div class="sl-box">
    <p class="sl-brand"><img src="{{ asset('img/soboru-logo-orange.png') }}" alt="{{ site_name() }}" width="136" height="32"><em>관리자</em></p>
    <h1 class="sl-title">관리자 비밀번호를<br>입력해 주세요</h1>
    <p class="sl-lead">소보루와 소비자제보센터를 함께 관리하는 화면이에요.</p>
    <form class="sl-form" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label class="sl-field"><span>비밀번호</span><input type="password" name="password" required autocomplete="current-password" placeholder="관리자 비밀번호"></label>
      <button class="sl-submit" type="submit">로그인</button>
    </form>
  </div>
</main>
{% endblock %}
