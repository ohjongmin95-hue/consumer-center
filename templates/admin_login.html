{% extends 'console.html' %}
{% block title %}관리자 로그인 | {{ txt('site.name') }}{% endblock %}
{% block content %}
<main class="auth-page">
  <div class="auth-card">
    <form class="auth-body" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <p class="auth-logo">{% if txt('site.logo_accent') %}<span>{{ txt('site.logo_accent') }}</span>{% endif %}{{ txt('site.logo_rest') }}</p>
      <h1 class="auth-title">관리자 로그인</h1>
      <input type="password" name="password" required autocomplete="current-password" placeholder="관리자 비밀번호" aria-label="관리자 비밀번호">
      <button class="auth-submit" type="submit">로그인</button>
    </form>
  </div>
</main>
{% endblock %}
