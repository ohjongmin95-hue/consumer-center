{% extends 'console.html' %}
{% block title %}관리자 비밀번호 변경 | {{ txt('site.name') }}{% endblock %}
{% block content %}
<main class="cs-page cs-narrow">
  <h1 class="cs-title">관리자 비밀번호 변경</h1>
  <form class="cs-panel" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="a-cur">지금 비밀번호</label><input id="a-cur" type="password" name="current" required autocomplete="current-password"></div>
    <div class="field"><label for="a-new">새 비밀번호</label><input id="a-new" type="password" name="password" minlength="12" maxlength="64" required autocomplete="new-password" placeholder="영문+숫자 12자 이상"></div>
    <div class="field"><label for="a-new2">새 비밀번호 확인</label><input id="a-new2" type="password" name="password2" minlength="12" maxlength="64" required autocomplete="new-password"></div>
    <button class="cs-btn cs-btn-main" type="submit">바꾸기</button>
    <p class="cs-muted" style="margin:14px 0 0">바꾸면 다른 컴퓨터·휴대폰에 남아 있던 관리자 로그인은 자동으로 끊겨요.</p>
  </form>
</main>
{% endblock %}
