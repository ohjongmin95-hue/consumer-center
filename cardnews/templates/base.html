<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}소보루 카드뉴스{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='soboru-character.png') }}">
<style>
@font-face{font-family:Pretendard;font-weight:700;src:url({{ url_for('static', filename='fonts/Pretendard-Bold.otf') }}) format('opentype')}
@font-face{font-family:Pretendard;font-weight:800;src:url({{ url_for('static', filename='fonts/Pretendard-ExtraBold.otf') }}) format('opentype')}
:root{--or:#EF920E;--or-soft:#FFF4E0;--brown:#652D1C;--cream:#FFF8EC;--ink:#1d1d1f;--sub:#6b6f76;--line:#eee6da;--ok:#0a7a50;--bad:#c22}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
a{color:var(--brown)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--brown);font:800 20px/1 Pretendard,sans-serif;letter-spacing:-.03em}
.brand img{width:40px;height:auto}.brand em{font-style:normal;color:var(--or)}
.top nav a{margin-left:16px;text-decoration:none;font-weight:700}.top nav a.on{color:var(--or)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
h1{font:800 28px/1.3 Pretendard,sans-serif;letter-spacing:-.03em;color:var(--brown);margin:0 0 8px}
h2{font:800 19px/1.4 Pretendard,sans-serif;color:var(--brown);margin:0 0 12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin:0 0 18px}
.meta{color:var(--sub);font-size:13px;margin:6px 0}
.warn{background:#fff1e6;border:1px solid #ffd2a8;color:#8a3d00;border-radius:12px;padding:10px 14px;margin:8px 0}
.flash{background:var(--brown);color:#fff;border-radius:12px;padding:12px 16px;margin:0 0 16px}
input[type=text],input[type=url],input[type=password],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid #ddd3c4;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:70px;resize:vertical}
label{display:block;margin:8px 0;font-size:13px;font-weight:700;color:#5a4a3f}
label.check{display:flex;gap:8px;align-items:center;font-weight:600}label.check input{width:auto}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>label{flex:1;min-width:160px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:700 14px Pretendard,sans-serif;padding:10px 18px;border-radius:999px;border:1px solid #ddd3c4;background:#fff;color:var(--brown);cursor:pointer}
button.primary{background:var(--or);border-color:var(--or);color:#fff}button.danger{color:var(--bad);border-color:#f3c4c4}
button[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#f2ede6;color:var(--sub)}
.badge.ok{background:#e3f6ee;color:var(--ok)}.badge.bad{background:#fde8e8;color:var(--bad)}
.item h3{margin:4px 0;font:800 17px/1.4 Pretendard,sans-serif}.item h3 a{text-decoration:none}
.spin{width:28px;height:28px;border:4px solid var(--or-soft);border-top-color:var(--or);border-radius:50%;animation:s 1s linear infinite;flex:none}@keyframes s{to{transform:rotate(360deg)}}
.wait{display:flex;gap:16px;align-items:center}
code{background:#f4efe8;border-radius:6px;padding:1px 6px}
</style>{% block head %}{% endblock %}</head>
<body>
<header class="top"><a class="brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='soboru-character.png') }}" alt="">SOBORU <em>카드뉴스</em></a>
  <nav><a href="{{ url_for('home') }}"{% if request.endpoint == 'home' %} class="on"{% endif %}>만들기</a><a href="{{ url_for('settings') }}"{% if request.endpoint == 'settings' %} class="on"{% endif %}>설정</a></nav></header>
<main class="wrap">
  {% for m in get_flashed_messages() %}<div class="flash" role="status">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body></html>
